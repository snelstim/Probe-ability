# HACS' repository validator: description, topics, issues, releases,
# hacs.json, manifest and brand images. Required to pass for inclusion in
# HACS' default list. It reads the repository through the GitHub API, so no
# checkout step is needed.
name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

# Home Assistant's own integration validator (manifest, translations,
# services, config flow). Required to pass for inclusion in HACS' default list.
name: Hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

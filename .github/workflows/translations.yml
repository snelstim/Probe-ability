# Checks translations/<lang>.json against en.json on every push and PR:
# placeholders, hassfest's value rules, and that every string the card,
# presets and backend use exists. Missing keys are warnings (Home Assistant
# shows English for them); the job summary shows how complete each language is.
name: Translations

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check translations
        run: python3 test_translations.py
